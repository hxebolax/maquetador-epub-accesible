[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maquetador-epub-accesible"
version = "1.0.2"
description = "Aplicación para crear libros EPUB 3 accesibles"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "@hxebolax", email = "xebolax@gmail.com"}
]
keywords = ["epub", "ebook", "accessibility", "accesibilidad", "wcag", "epub3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "wxPython>=4.2.0",
    "EbookLib>=0.18",
    "markdown>=3.4",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "weasyprint>=60.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=5.0",
    "pytest>=7.0",
    "hypothesis>=6.0",
]

[project.urls]
Homepage = "https://github.com/hxebolax/maquetador-epub-accesible"
Documentation = "https://github.com/hxebolax/maquetador-epub-accesible#readme"
Repository = "https://github.com/hxebolax/maquetador-epub-accesible.git"
Issues = "https://github.com/hxebolax/maquetador-epub-accesible/issues"
Changelog = "https://github.com/hxebolax/maquetador-epub-accesible/blob/main/CHANGELOG.md"

[project.scripts]
maquetador-epub = "main:main"

[project.gui-scripts]
maquetador-epub-gui = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.recursos" = ["*.css"]
